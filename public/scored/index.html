<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>Scored applications</title>
</head>
<body>
<p>This page exists so Netlify registers the scored-application form. Nothing to see here.</p>
<form name="scored-application" method="POST" data-netlify="true" hidden>
  <input type="hidden" name="form-name" value="scored-application">
  <input type="text" name="applicant">
  <input type="text" name="phone">
  <input type="text" name="based-in">
  <input type="text" name="score">
  <input type="text" name="verdict">
  <textarea name="summary"></textarea>
  <textarea name="flags"></textarea>
  <input type="text" name="honesty">
</form>
</body>
</html>
