# End of tenancy checklist. Optional save/report. Missing keys must still return 200.
[[redirects]]
  from = "/api/checklist"
  to = "/.netlify/functions/checklist-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/checklist/*"
  to = "/.netlify/functions/checklist-api"
  status = 200
  force = true

# Private report links. Not prerendered. noindex is also set by the function.
# The id is the last path segment. The function reads it from the request path
# because a rewrite does not reliably add a query string.
[[redirects]]
  from = "/checklist/report/*"
  to = "/.netlify/functions/checklist-api/:splat"
  status = 200
  force = true

[[headers]]
  for = "/checklist/report/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

# Website editor (/admin): its API and photos uploaded before publishing.
[[redirects]]
  from = "/api/editor"
  to = "/.netlify/functions/editor-api"
  status = 200
  force = true

[[redirects]]
  from = "/api/draft-image/*"
  to = "/.netlify/functions/editor-image?f=:splat"
  status = 200
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/go/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Send the Netlify subdomain to the real domain so Google only sees one copy.
[[redirects]]
