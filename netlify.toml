[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[plugins]]
package = "netlify-plugin-cache"
  [plugins.inputs]
  paths = ["public/images/_r"]

# Security headers for every page (Screpy audit, 16 Nov 2026). frame-ancestors only stops other sites
# from showing our pages inside their own; it does not limit our own scripts, forms or embeds.
[[headers]]
  for = "/.well-known/security.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Cross-Origin-Opener-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self' 'unsafe-inline' 'inline-speculation-rules' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://www.clarity.ms https://*.clarity.ms https://bzrcdn.openai.com https://connect.facebook.net https://app.visitortracking.com; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://www.google.co.uk https://i.ytimg.com https://www.google-analytics.com https://*.google-analytics.com https://www.googletagmanager.com https://stats.g.doubleclick.net https://www.clarity.ms https://*.clarity.ms https://www.facebook.com https://app.visitortracking.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.googletagmanager.com https://www.clarity.ms https://*.clarity.ms https://app.visitortracking.com https://bzrcdn.openai.com https://bzr.openai.com https://www.facebook.com https://connect.facebook.net https://graph.facebook.com https://app.sncleaningservices.co.uk https://app.dilvon.com; frame-src 'self' https://www.youtube-nocookie.com https://www.youtube.com https://app.sncleaningservices.co.uk https://app.dilvon.com https://dilvon.com; form-action 'self' https://app.sncleaningservices.co.uk; frame-ancestors 'self' https://*.dilvon.com https://dilvon.com https://*.sncleaningservices.co.uk; worker-src 'self' blob:"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

