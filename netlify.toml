[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/save-score"
  to = "/.netlify/functions/save-score"
  status = 200
  force = true

[[redirects]]
  from = "/applicants"
  to = "/.netlify/functions/applicants"
  status = 200
  force = true

# Send the Netlify subdomain to the real domain so Google only sees one copy.
[[redirects]]
  from = "https://sncleaningwebsite.netlify.app/*"
  to = "https://sncleaningservices.co.uk/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.sncleaningservices.co.uk/*"
  to = "https://sncleaningservices.co.uk/:splat"
  status = 301
  force = true

# Commercial services moved to the SN Clean site (tagged so SN Clean can see
# the referral). Covers the service pages and any area pages under them.
[[redirects]]
  from = "/office-cleaning/*"
  to = "https://snclean.co.uk/?ref=sncleaningservices&utm_source=sncleaningservices.co.uk&utm_medium=referral&utm_campaign=office_cleaning_redirect"
  status = 301
  force = true

[[redirects]]
  from = "/nursery-cleaning/*"
  to = "https://snclean.co.uk/?ref=sncleaningservices&utm_source=sncleaningservices.co.uk&utm_medium=referral&utm_campaign=nursery_cleaning_redirect"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

